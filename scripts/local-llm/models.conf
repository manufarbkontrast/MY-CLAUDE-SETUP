# Lokale Modell-Rollen fuer den Harness (siehe docs/local-models/PLAN.md).
# Modellnamen an LM Studio (`lms ls`) bzw. Ollama (`ollama list`) anpassen.
# Jede Variable kann per Umgebungsvariable ueberschrieben werden.

# Executor: headless Claude Code gegen lokalen Anthropic-kompatiblen Server
# LM Studio: http://localhost:1234   Ollama: http://localhost:11434
: "${EXECUTOR_BASE_URL:=http://localhost:1234}"
: "${EXECUTOR_MODEL:=qwen3.6-35b-a3b}"
: "${EXECUTOR_TOKEN:=lmstudio}"
# Kontextfenster, mit dem das Modell in LM Studio geladen ist (lms load --context-length).
# Claude Code kennt lokale Modelle nicht und nimmt sonst 200K an -> Auto-Compact greift zu spaet.
: "${EXECUTOR_CONTEXT:=65536}"

# Kritiker: OpenAI-kompatibler Chat-Endpoint (andere Modellfamilie als der Executor)
: "${CRITIC_BASE_URL:=http://localhost:1234/v1}"
: "${CRITIC_MODEL:=gpt-oss-120b}"
: "${CRITIC_API_KEY:=lmstudio}"

# Schleife
: "${MAX_ROUNDS:=3}"
# Tools, die der Executor ohne Rueckfrage nutzen darf
: "${EXECUTOR_ALLOWED_TOOLS:=Read,Edit,Write,Glob,Grep,Bash(npm test:*),Bash(npm run:*),Bash(npx:*),Bash(pytest:*),Bash(git diff:*),Bash(git status:*)}"
